<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#4b0082">
<meta name="description" content="Belajar mengetik huruf dan kata sambil bermain.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ketik Yuk!">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Ketik Yuk!</title>
<style>
html,body{margin:0;height:100%;width:100%;position:fixed;inset:0;background:linear-gradient(160deg,#4b0082,#7b2ff7,#00c9a7);color:#fff;font-family:sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;left:0;top:var(--vt,0px);width:100%;height:var(--vh,100%);box-sizing:border-box}

/* ---------- MENU ---------- */
#menu{z-index:5;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#menu.off{display:none}
#menuIn{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#menuIn h1{margin:0;font-size:38px;text-shadow:0 2px 4px #0006}
#info{font-size:16px;opacity:.9;line-height:1.4}
.grp{display:flex;flex-direction:column;align-items:center;gap:6px}
.lbl{font-size:13px;opacity:.85;letter-spacing:1px;text-transform:uppercase}
.row{display:flex;gap:12px;justify-content:center}
.mchip{padding:12px 26px;border-radius:20px;background:#ffffff22;font-weight:bold;font-size:20px;cursor:pointer}
.mchip.on{background:#ffd93d;color:#4b0082}
button{font-size:24px;padding:12px 44px;border:0;border-radius:26px;background:#ffd93d;color:#4b0082;font-weight:bold;box-shadow:0 4px 0 #c9a415;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #c9a415}
body.compact #menuIn{gap:8px}
body.compact #menuIn h1{font-size:26px}
body.compact #info{font-size:13px}
body.compact .mchip{padding:8px 20px;font-size:17px}
body.compact button{font-size:20px;padding:8px 36px}
body.compact .lbl{font-size:11px}

/* ---------- GAME ---------- */
#game{display:none;z-index:1;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#game.on{display:flex}
#card{flex:1;min-width:0;min-height:0;position:relative;background:#ffffff22;border:3px solid #ffffff55;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #00000022;box-sizing:border-box;overflow:hidden}
#target{font-size:120px;font-weight:900;letter-spacing:4px;display:flex;white-space:nowrap;line-height:1;text-shadow:0 3px 6px #0004}
#target.shake{animation:shake .35s}
#target span{display:inline-block;transition:.15s}
#target span.ok{color:#7CFC00;transform:scale(1.15)}
#target span.bad{color:#ff5252}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3) rotate(5deg)}100%{transform:scale(1)}}
#target.win{animation:pop .5s}
#badge{position:absolute;top:6px;right:10px;font-size:min(100px,22vh);opacity:0;transform:scale(.4) rotate(-15deg);transition:.25s;pointer-events:none}
#badge.show{opacity:1;transform:scale(1) rotate(6deg)}
#quit{position:absolute;top:6px;left:8px;width:34px;height:34px;padding:0;font-size:16px;line-height:34px;border-radius:50%;background:#ffffff22;color:#fff;box-shadow:none;opacity:.7}
#quit:active{transform:none;box-shadow:none}

#fx{position:fixed;inset:0;pointer-events:none;z-index:10}
#kbd{position:fixed;top:0;left:0;opacity:0;height:1px;width:1px;font-size:16px;border:0;padding:0;pointer-events:none}
</style>
</head>
<body>

<!-- Layar permainan: hanya huruf / kata -->
<div id="game" class="screen">
  <div id="card">
    <div id="target"></div>
    <div id="badge"></div>
    <button id="quit" aria-label="Kembali ke menu">✕</button>
  </div>
</div>

<input id="kbd" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
<canvas id="fx"></canvas>

<!-- Menu utama -->
<div id="menu" class="screen">
  <div id="menuIn">
    <h1 id="t">Ketik Yuk!</h1>
    <div id="info">Belajar mengetik huruf dan kata sambil bermain.</div>
    <div class="grp"><div class="lbl">Yang diketik</div>
      <div class="row"><span class="mchip" id="mHuruf">Huruf</span><span class="mchip" id="mKata">Kata</span></div>
    </div>
    <div class="grp"><div class="lbl">Tampilan</div>
      <div class="row"><span class="mchip" id="cBesar">BESAR</span><span class="mchip" id="cKecil">kecil</span></div>
    </div>
    <button id="go">Mulai</button>
  </div>
</div>

<script>
const WORDS=['IBU','AYAH','KUCING','BOLA','MEJA','BUKU','AIR','NASI','MOBIL','RUMAH','SUSU','BUNGA'];
const ALPHA=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const $=q=>document.getElementById(q);
const target=$('target'),kbd=$('kbd'),card=$('card');

let mode='huruf',caseMode='upper';          // pengaturan menu
let items=[],idx=0,score=0,wordStart=0,speeds=[],playing=false;

/* ---------- simpan pengaturan ---------- */
try{
  mode=localStorage.typingMode==='kata'?'kata':'huruf';
  caseMode=localStorage.typingCase==='lower'?'lower':'upper';
}catch(e){}
function saveSettings(){try{localStorage.typingMode=mode;localStorage.typingCase=caseMode}catch(e){}}

/* ---------- sound ---------- */
let ac;
function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type='sine',at=0,v=.18,slideTo=null){
  const t=ctx().currentTime+at,o=ctx().createOscillator(),g=ctx().createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(ctx().destination);o.start(t);o.stop(t+d+.02);
}
const sfxOk=()=>[523,659,784].forEach((f,i)=>tone(f,.15,'triangle',i*.08,.15));
const sfxWin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'square',i*.1,.12));
const sfxBad=()=>tone(180,.15,'sawtooth',0,.1);
function speak(text){
  if(!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.85;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- confetti ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let ps=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function confetti(x,y,n){
  for(let i=0;i<n;i++)ps.push({x,y,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,s:4+Math.random()*6,h:Math.random()*360,l:70});
  if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;cx.fillStyle=`hsl(${p.h},90%,60%)`;cx.fillRect(p.x,p.y,p.s,p.s)});
  ps=ps.filter(p=>p.l>0&&p.y<cv.height);
  if(ps.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}
function burst(n){const r=card.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,n)}

/* ---------- ukuran & viewport ---------- */
function fit(){
  const w=card.clientWidth-30,h=card.clientHeight-30;
  if(w<=0||h<=0)return;
  let fs=Math.max(24,Math.min(320,h*.75));
  target.style.fontSize=fs+'px';
  while(target.getBoundingClientRect().width>w&&fs>20){fs-=4;target.style.fontSize=fs+'px'}
}
function vp(){
  const v=window.visualViewport,h=v?v.height:innerHeight,r=document.documentElement.style;
  r.setProperty('--vh',h+'px');
  r.setProperty('--vt',(v?v.offsetTop:0)+'px');
  document.body.classList.toggle('compact',h<420);
  window.scrollTo(0,0);
  if(playing)fit();
}

/* ---------- tampilan ---------- */
const dcase=s=>caseMode==='upper'?s.toUpperCase():s.toLowerCase();
function render(typed=''){
  const w=items[idx];
  target.innerHTML=[...w].map((c,i)=>{
    const t=typed[i];
    let cls='';
    if(t!==undefined)cls=t.toUpperCase()===c?'ok':'bad';
    return `<span class="${cls}">${dcase(c)}</span>`;
  }).join('');
  fit();
}
const badge=$('badge');
const speedEmoji=ms=>ms<4000?'🐆':ms<8000?'🐴':'🐌';
function showSpeedBadge(ms){
  badge.textContent=speedEmoji(ms);
  badge.classList.remove('show');void badge.offsetWidth;badge.classList.add('show');
}
function bump(cls){target.classList.remove(cls);void target.offsetWidth;target.classList.add(cls)}

/* ---------- menu ---------- */
function setChips(){
  $('mHuruf').classList.toggle('on',mode==='huruf');
  $('mKata').classList.toggle('on',mode==='kata');
  $('cBesar').classList.toggle('on',caseMode==='upper');
  $('cKecil').classList.toggle('on',caseMode==='lower');
}
function showMenu(title,info,btn){
  playing=false;
  $('game').classList.remove('on');
  kbd.blur();kbd.value='';badge.classList.remove('show');
  $('t').textContent=title||'Ketik Yuk!';
  $('info').innerHTML=info||'Belajar mengetik huruf dan kata sambil bermain.';
  $('go').textContent=btn||'Mulai';
  $('menu').classList.remove('off');
  vp();
}
$('mHuruf').onclick=()=>{mode='huruf';saveSettings();setChips()};
$('mKata').onclick=()=>{mode='kata';saveSettings();setChips()};
$('cBesar').onclick=()=>{caseMode='upper';saveSettings();setChips()};
$('cKecil').onclick=()=>{caseMode='lower';saveSettings();setChips()};

/* ---------- permainan ---------- */
function startGame(){
  try{ctx()}catch(e){}
  items=mode==='huruf'?shuffle(ALPHA):shuffle(WORDS);
  idx=0;score=0;speeds=[];playing=true;
  $('menu').classList.add('off');
  $('game').classList.add('on');
  kbd.value='';badge.classList.remove('show');
  kbd.focus();                       // harus dalam handler klik supaya keyboard HP muncul
  vp();render();wordStart=Date.now();
  setTimeout(vp,300);setTimeout(vp,700);
}
function nextRound(){
  kbd.value='';badge.classList.remove('show');
  idx++;
  if(idx>=items.length){finish();return}
  wordStart=Date.now();
  render();
}
function finish(){
  sfxWin();confetti(innerWidth/2,innerHeight/3,180);vib([100,50,100,50,200]);
  let best=score;
  try{best=Math.max(score,+localStorage.typingBest||0);localStorage.typingBest=best}catch(e){}
  let info='Skor: '+score+' · Terbaik: '+best;
  if(mode==='kata'&&speeds.length){
    const avg=speeds.reduce((a,b)=>a+b,0)/speeds.length;
    info+=`<br><br><span style="font-size:70px">${speedEmoji(avg)}</span><br>Rata-rata: ${(avg/1000).toFixed(1)} detik/kata`;
  }
  showMenu('Selesai! 🎉',info,'Main Lagi');
}
$('go').onclick=startGame;
$('quit').onclick=e=>{e.stopPropagation();showMenu()};
$('game').addEventListener('click',()=>{if(playing)kbd.focus()});

/* ---------- input ---------- */
kbd.addEventListener('input',()=>{
  if(!playing)return;
  if(mode==='huruf'){
    const val=kbd.value.trim();
    if(!val)return;
    const typed=val[val.length-1].toUpperCase();
    kbd.value='';
    const ch=items[idx];
    if(typed===ch){
      score+=10;
      target.querySelector('span').classList.add('ok');
      sfxOk();bump('win');speak(ch);vib(30);
      burst(26);
      setTimeout(nextRound,450);
    }else{
      sfxBad();bump('shake');vib(60);
    }
  }else{
    const w=items[idx];
    const val=kbd.value.toUpperCase().slice(0,w.length);
    render(val);
    if(val.length===w.length){
      if(val===w){
        score+=25;
        sfxOk();bump('win');speak(w);vib(30);
        const ms=Date.now()-wordStart;
        speeds.push(ms);showSpeedBadge(ms);
        burst(36);
        setTimeout(nextRound,700);
      }else{
        sfxBad();bump('shake');vib(60);
        setTimeout(()=>{kbd.value='';render('')},500);
      }
    }
  }
});

/* ---------- viewport listeners ---------- */
addEventListener('resize',vp);
addEventListener('orientationchange',()=>setTimeout(vp,250));
if(window.visualViewport){visualViewport.addEventListener('resize',vp);visualViewport.addEventListener('scroll',vp)}
kbd.addEventListener('focus',()=>setTimeout(vp,300));
kbd.addEventListener('blur',()=>setTimeout(vp,300));
setChips();vp();

/* ---------- PWA: service worker ---------- */
if('serviceWorker' in navigator){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
</body>
</html>
