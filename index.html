<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4b0082">
<meta name="description" content="Belajar mengetik huruf dan kata sambil bermain.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ketik Yuk!">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Ketik Yuk!</title>
<style>
html,body{margin:0;height:100%;background:linear-gradient(160deg,#4b0082,#7b2ff7,#00c9a7);color:#fff;font-family:sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-sizing:border-box}
#top{width:100%;max-width:420px;display:flex;justify-content:space-between;font-weight:bold;font-size:16px;text-shadow:0 1px 3px #0006}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:18px}
#card{background:#ffffff22;border:3px solid #ffffff55;border-radius:28px;width:min(94vw,520px);min-height:min(78vw,360px);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #00000022;padding:14px;box-sizing:border-box;position:relative}
#target{font-size:min(32vw,130px);font-weight:900;letter-spacing:4px;display:flex}
#target.shake{animation:shake .35s}
#target span{display:inline-block;transition:.15s}
#target span.ok{color:#7CFC00;transform:scale(1.15)}
#target span.bad{color:#ff5252}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.4) rotate(6deg)}100%{transform:scale(1)}}
#target.win{animation:pop .5s}
#hint{font-size:14px;opacity:.85;text-align:center;text-shadow:0 1px 2px #0006}
#fx{position:fixed;inset:0;pointer-events:none}
.ov{position:fixed;inset:0;background:linear-gradient(160deg,#4b0082dd,#7b2ff7dd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;box-sizing:border-box}
button{font-size:22px;padding:12px 36px;border:0;border-radius:24px;background:#ffd93d;color:#4b0082;font-weight:bold;box-shadow:0 4px 0 #c9a415}
#kbd{position:absolute;opacity:0;height:0;width:0;pointer-events:none}
#modebar{display:flex;gap:12px;font-size:20px}
.mchip{padding:10px 24px;border-radius:20px;background:#ffffff22;font-weight:bold}
.mchip.on{background:#ffd93d;color:#4b0082}
#badge{position:absolute;top:-30px;right:-20px;font-size:110px;opacity:0;transform:scale(.4) rotate(-15deg);transition:.25s;pointer-events:none}
#badge.show{opacity:1;transform:scale(1) rotate(6deg)}
</style>
</head>
<body>
<div id="app">
  <div id="top"><span id="lv"></span><span>Skor: <b id="sc">0</b></span></div>
  <div id="stage">
    <div id="card"><div id="target"></div><div id="badge"></div></div>
    <div id="hint">👆 Tap di sini lalu ketik di keyboard</div>
    <div id="modebar"><span class="mchip" id="mHuruf">Huruf</span><span class="mchip" id="mKata">Kata</span></div>
    <div id="modebar"><span class="mchip" id="cBesar">Besar</span><span class="mchip" id="cKecil">kecil</span></div>
  </div>
</div>
<input id="kbd" autocomplete="off" autocorrect="off" autocapitalize="characters">
<canvas id="fx"></canvas>
<div class="ov" id="ov"><h1 id="t">Ketik Yuk!</h1><div id="i">Belajar mengetik huruf dan kata sambil bermain.</div><button id="go">Mulai</button></div>
<script>
const LETTERS=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].sort(()=>Math.random()-.5);
const WORDS=['IBU','AYAH','KUCING','BOLA','MEJA','BUKU','AIR','NASI','MOBIL','RUMAH','SUSU','BUNGA'];
let mode='huruf',li=0,wi=0,score=0,wordShuffled=[...WORDS].sort(()=>Math.random()-.5),wordStart=0,caseMode='upper',speeds=[];
const $=q=>document.getElementById(q);
const target=$('target'),kbd=$('kbd'),sc=$('sc'),lv=$('lv');

/* ---------- sound ---------- */
let ac;
function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type='sine',at=0,v=.18,slideTo=null){
  const t=ctx().currentTime+at,o=ctx().createOscillator(),g=ctx().createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(ctx().destination);o.start(t);o.stop(t+d+.02);
}
const sfxOk=()=>[523,659,784].forEach((f,i)=>tone(f,.15,'triangle',i*.08,.15));
const sfxWin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'square',i*.1,.12));
const sfxBad=()=>tone(180,.15,'sawtooth',0,.1);
function speak(text){
  if(!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.85;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

/* ---------- confetti ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let ps=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function confetti(x,y,n){
  for(let i=0;i<n;i++)ps.push({x,y,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,s:4+Math.random()*6,h:Math.random()*360,l:70});
  if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;cx.fillStyle=`hsl(${p.h},90%,60%)`;cx.fillRect(p.x,p.y,p.s,p.s)});
  ps=ps.filter(p=>p.l>0&&p.y<cv.height);
  if(ps.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}

/* ---------- render ---------- */
function dcase(s){return caseMode==='upper'?s.toUpperCase():s.toLowerCase()}
function renderLetter(){
  const ch=LETTERS[li];
  target.innerHTML=`<span>${dcase(ch)}</span>`;
  lv.textContent='Huruf '+(li+1)+' / '+LETTERS.length;
}
function renderWord(typed=''){
  const w=wordShuffled[wi];
  target.innerHTML=[...w].map((c,i)=>{
    const t=typed[i];
    let cls='';
    if(t!==undefined)cls=t.toUpperCase()===c?'ok':'bad';
    return `<span class="${cls}">${dcase(c)}</span>`;
  }).join('');
  lv.textContent='Kata '+(wi+1)+' / '+wordShuffled.length;
}
function render(){ mode==='huruf'?renderLetter():renderWord(); }

const badge=$('badge');
function speedEmoji(ms){ return ms<4000?'🐆' : ms<8000?'🐴' : '🐌' }
function showSpeedBadge(ms){
  badge.textContent=speedEmoji(ms);
  badge.classList.remove('show');void badge.offsetWidth;badge.classList.add('show');
}

function nextRound(){
  kbd.value='';badge.classList.remove('show');
  if(mode==='huruf'){
    li++;
    if(li>=LETTERS.length){ mode='kata'; li=0; setModeChips(); render(); wordStart=Date.now(); return; }
  } else {
    wi++;
    if(wi>=wordShuffled.length){ finish(); return; }
    wordStart=Date.now();
  }
  render();
}
function finish(){
  sfxWin();confetti(innerWidth/2,innerHeight/3,180);navigator.vibrate&&navigator.vibrate([100,50,100,50,200]);
  const best=Math.max(score,+localStorage.typingBest||0);localStorage.typingBest=best;
  const avg=speeds.length?speeds.reduce((a,b)=>a+b,0)/speeds.length:0;
  const emo=speeds.length?speedEmoji(avg):'';
  $('t').textContent='Selesai! 🎉';
  $('i').innerHTML='Skor: '+score+' · Terbaik: '+best+
    (speeds.length?`<br><br><span style="font-size:70px">${emo}</span><br>Rata-rata: ${(avg/1000).toFixed(1)} detik/kata`:'');
  $('go').textContent='Main Lagi';
  $('ov').style.display='flex';
}
function bump(cls){target.classList.remove(cls);void target.offsetWidth;target.classList.add(cls)}

function setModeChips(){
  $('mHuruf').classList.toggle('on',mode==='huruf');
  $('mKata').classList.toggle('on',mode==='kata');
}
function setCaseChips(){
  $('cBesar').classList.toggle('on',caseMode==='upper');
  $('cKecil').classList.toggle('on',caseMode==='lower');
}

/* ---------- input handling ---------- */
kbd.addEventListener('input',()=>{
  if(mode==='huruf'){
    const val=kbd.value.trim();
    if(!val)return;
    const typed=val[val.length-1].toUpperCase();
    kbd.value='';
    const target_ch=LETTERS[li];
    if(typed===target_ch){
      score+=10;sc.textContent=score;
      target.querySelector('span').classList.add('ok');
      sfxOk();bump('win');speak(target_ch);navigator.vibrate&&navigator.vibrate(30);
      const r=$('card').getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,26);
      setTimeout(nextRound,450);
    } else {
      sfxBad();bump('shake');navigator.vibrate&&navigator.vibrate(60);
    }
  } else {
    const w=wordShuffled[wi];
    const val=kbd.value.toUpperCase().slice(0,w.length);
    renderWord(val);
    if(val.length===w.length){
      if(val===w){
        score+=25;sc.textContent=score;
        sfxOk();bump('win');speak(w);navigator.vibrate&&navigator.vibrate(30);
        speeds.push(Date.now()-wordStart);
        showSpeedBadge(Date.now()-wordStart);
        const r=$('card').getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,36);
        setTimeout(nextRound,700);
      } else {
        sfxBad();bump('shake');navigator.vibrate&&navigator.vibrate(60);
        setTimeout(()=>{kbd.value='';renderWord('')},500);
      }
    }
  }
});
$('card').addEventListener('click',()=>kbd.focus());
$('mHuruf').addEventListener('click',()=>{mode='huruf';li=0;kbd.value='';setModeChips();render();kbd.focus()});
$('mKata').addEventListener('click',()=>{mode='kata';wi=0;wordShuffled=[...WORDS].sort(()=>Math.random()-.5);kbd.value='';badge.classList.remove('show');setModeChips();render();kbd.focus();wordStart=Date.now()});
$('cBesar').addEventListener('click',()=>{caseMode='upper';setCaseChips();render();kbd.focus()});
$('cKecil').addEventListener('click',()=>{caseMode='lower';setCaseChips();render();kbd.focus()});

$('go').onclick=()=>{
  try{ctx()}catch(e){}
  mode='huruf';li=0;wi=0;score=0;sc.textContent=0;
  LETTERS.sort(()=>Math.random()-.5);
  wordShuffled=[...WORDS].sort(()=>Math.random()-.5);
  setModeChips();setCaseChips();render();
  $('ov').style.display='none';
  setTimeout(()=>kbd.focus(),200);
};
setModeChips();

/* ---------- PWA: service worker ---------- */
if('serviceWorker' in navigator){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
</body>
</html>
